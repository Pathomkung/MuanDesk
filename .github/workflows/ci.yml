name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run test:navigation
      - run: npm run test:queue
      - run: npm run test:seek
      - run: npm run test:release
      - run: npm run test:equalizer
      - run: npm run test:main-equalizer
      - run: npm run test:language
      - run: npm run release
      - run: npm run test:installer
      - uses: actions/upload-artifact@v4
        with:
          name: MuanDesk-release
          path: dist/releases/*
          if-no-files-found: error
